<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kasir - ASRIEATS</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', sans-serif; background: #f8fafc; color: #1e293b; padding: 24px; }
  .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
  .brand h1 { font-size: 22px; color: #1a6b4a; }
  .btn-logout { background: #dc4a3d; color: white; border: none; padding: 8px 20px; border-radius: 20px; cursor: pointer; font-weight: 600; transition: 0.2s; }
  .btn-logout:hover { background: #b91c1c; }
  
  .stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; margin-bottom: 24px; }
  .stat-card { background: white; padding: 20px; border-radius: 12px; border: 1px solid #e2e8f0; display: flex; justify-content: space-between; align-items: center; }
  .stat-title { font-size: 12px; color: #64748b; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
  .stat-val { font-size: 24px; font-weight: 700; margin-top: 5px; }
  .stat-icon { font-size: 24px; color: #1a6b4a; background: #e8f5ee; padding: 12px; border-radius: 50%; }

  .tabs { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
  .tab-btn { padding: 10px 20px; background: transparent; border: 1px solid #cbd5e1; border-radius: 8px; cursor: pointer; font-weight: 600; color: #64748b; transition: 0.2s; }
  .tab-btn.active { background: #1a6b4a; color: white; border-color: #1a6b4a; }

  .filter-box { background: white; padding: 15px 20px; border-radius: 12px; border: 1px solid #e2e8f0; margin-bottom: 24px; display: flex; align-items: center; gap: 15px; flex-wrap: wrap; }
  .filter-box select, .filter-box input { padding: 8px 15px; border-radius: 8px; border: 1px solid #cbd5e1; font-family: inherit; font-size: 14px; outline: none; cursor: pointer; }
  .btn-reset { background: #e2e8f0; color: #1e293b; border: none; padding: 8px 15px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 13px; transition: 0.2s; }
  .btn-reset:hover { background: #cbd5e1; }

  .table-container { background: white; border-radius: 12px; border: 1px solid #e2e8f0; overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; min-width: 850px; }
  th { text-align: left; padding: 15px 20px; background: #f1f5f9; font-size: 13px; color: #64748b; font-weight: 600; }
  td { padding: 15px 20px; font-size: 14px; border-bottom: 1px solid #e2e8f0; vertical-align: middle; }
  
  .btn-action { padding: 6px 10px; border: none; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 600; transition: 0.2s; white-space: nowrap; }
  .btn-action:hover { opacity: 0.8; }
  .btn-print { background: #64748b; color: white; }
  .btn-done { background: #1a6b4a; color: white; }
  .btn-del { background: #fee2e2; color: #dc4a3d; }

  .badge-tipe { font-size: 10px; padding: 2px 6px; border-radius: 4px; background: #e2e8f0; white-space: nowrap; }
  .badge-status { font-size: 10px; padding: 2px 6px; border-radius: 4px; background: #dcfce7; color: #166534; font-weight: 600; white-space: nowrap; }

  /* CSS UNTUK TOGGLE SWITCH (SAKLAR) */
  .switch { position: relative; display: inline-block; width: 46px; height: 24px; vertical-align: middle; margin-right: 8px; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #cbd5e1; transition: .4s; border-radius: 24px; }
  .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
  input:checked + .slider { background-color: #1a6b4a; }
  input:checked + .slider:before { transform: translateX(22px); }
  .status-label { font-weight: 600; font-size: 13px; vertical-align: middle; }

  .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: none; justify-content: center; align-items: center; z-index: 2000; backdrop-filter: blur(3px); }
  .modal-overlay.active { display: flex; }
  .modal-content { background: white; padding: 30px; width: 90%; max-width: 400px; position: relative; border-radius: 16px; box-shadow: 0 20px 40px rgba(0,0,0,0.2); text-align: center; }
  
  @media print { body * { visibility: hidden; } #printArea, #printArea * { visibility: visible; } #printArea { position: absolute; left: 0; top: 0; width: 80mm; } }
</style>
</head>
<body>

<div class="header">
  <div class="brand"><h1 id="headerTitle">ASRIEATS Kasir</h1></div>
  <button class="btn-logout" onclick="openLogoutModal()">Logout</button>
</div>

<div class="stats-grid">
  <div class="stat-card">
    <div>
      <div class="stat-title">Pesanan Aktif</div>
      <div class="stat-val" id="orderCount">0</div>
    </div>
    <i class="fas fa-receipt stat-icon"></i>
  </div>
  <div class="stat-card">
    <div>
      <div class="stat-title" id="revenueTitle">Pendapatan (Hari Ini)</div>
      <div class="stat-val" id="revenueTotal">Rp 0</div>
    </div>
    <i class="fas fa-wallet stat-icon"></i>
  </div>
</div>

<div class="tabs">
  <button class="tab-btn active" id="tabActive" onclick="switchTab('active')">Pesanan Aktif</button>
  <button class="tab-btn" id="tabHistory" onclick="switchTab('history')">Riwayat Selesai</button>
  <button class="tab-btn" id="tabMenu" onclick="switchTab('menu')">Kelola Menu</button>
</div>

<div class="filter-box" id="filterBox">
  <label><i class="fas fa-filter"></i> Tipe Laporan:</label>
  <select id="filterType" onchange="changeFilterType()">
    <option value="daily">Harian</option>
    <option value="monthly">Bulanan</option>
    <option value="all">Semua Waktu</option>
  </select>

  <input type="date" id="filterTanggal" onchange="fetchData()">
  <input type="month" id="filterBulan" onchange="fetchData()" style="display:none;">

  <button class="btn-reset" onclick="resetFilter()">Reset</button>
</div>

<!-- TABEL PESANAN -->
<div class="table-container" id="tableOrders">
  <table>
    <thead>
      <tr>
        <th>Waktu</th>
        <th>Meja / Nama</th>
        <th>Pesanan</th>
        <th>Total</th>
        <th>Aksi</th>
      </tr>
    </thead>
    <tbody id="tableBody"></tbody>
  </table>
</div>

<!-- TABEL KELOLA MENU -->
<div class="table-container" id="tableMenu" style="display: none;">
  <table>
    <thead>
      <tr>
        <th>Gambar</th>
        <th>Nama Menu</th>
        <th>Harga</th>
        <th>Kategori</th>
        <th>Status Ketersediaan</th>
      </tr>
    </thead>
    <tbody id="menuTableBody"></tbody>
  </table>
</div>

<div id="printArea" style="display:none;"></div>
<div id="toast" style="position:fixed; bottom:20px; right:20px; background:#1e293b; color:white; padding:10px 20px; border-radius:20px; opacity:0; transition:0.3s; z-index:9999;"></div>

<!-- MODAL KONFIRMASI CUSTOM (SELESAI/HAPUS) -->
<div class="modal-overlay" id="actionModal">
  <div class="modal-content">
    <div id="modalIcon" style="font-size: 40px; margin-bottom: 15px;"></div>
    <h3 id="modalTitle" style="font-size: 20px; margin-bottom: 10px; color: #1e293b;"></h3>
    <p id="modalDesc" style="color: #64748b; font-size: 14px; margin-bottom: 25px; line-height: 1.5;"></p>
    <div style="display: flex; gap: 10px;">
      <button class="btn-action" onclick="closeActionModal()" style="flex: 1; background: #e2e8f0; color: #1e293b; padding: 12px; font-size: 14px; margin: 0;">Batal</button>
      <button class="btn-action" id="modalConfirmBtn" onclick="executeAction()" style="flex: 1; color: white; padding: 12px; font-size: 14px; margin: 0;">OK</button>
    </div>
  </div>
</div>

<!-- MODAL KONFIRMASI LOGOUT -->
<div class="modal-overlay" id="logoutModal">
  <div class="modal-content" style="text-align: center; max-width: 350px; padding: 30px 20px;">
    <div style="font-size: 40px; color: #dc4a3d; margin-bottom: 15px;">
      <i class="fas fa-sign-out-alt"></i>
    </div>
    <h3 style="font-size: 20px; margin-bottom: 10px; color: #1e293b;">Yakin Mau Logout?</h3>
    <p style="color: #64748b; font-size: 14px; margin-bottom: 25px; line-height: 1.5;">Anda harus masuk kembali untuk bisa mengakses dashboard kasir.</p>
    <div style="display: flex; gap: 10px;">
      <button class="btn-action" onclick="closeLogoutModal()" style="flex: 1; background: #e2e8f0; color: #1e293b; padding: 12px; font-size: 14px; margin: 0;">Batal</button>
      <button class="btn-action" onclick="executeLogout()" style="flex: 1; background: #dc4a3d; color: white; padding: 12px; font-size: 14px; margin: 0;">Logout</button>
    </div>
  </div>
</div>

}

let allOrders = [];
let allMenus = [];
let currentTab = 'active'; 
let pendingActionId = null;
let currentActionType = null;

document.addEventListener('DOMContentLoaded', () => {
  const today = new Date();
  const year = today.getFullYear();
  const month = String(today.getMonth() + 1).padStart(2, '0');

function checkAuth() {
  if (!KANTIN_ID || !KASIR_NAME) { window.location.href = '/'; return; }
  document.getElementById('headerTitle').textContent = (KANTIN_NAMES[KANTIN_ID] || 'Kasir') + ' - ' + KASIR_NAME;
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.opacity = 1;
  setTimeout(() => t.style.opacity = 0, 2500);
}

function switchTab(tab) {
  currentTab = tab;
  document.getElementById('tabActive').classList.toggle('active', tab === 'active');
  document.getElementById('tabHistory').classList.toggle('active', tab === 'history');
  document.getElementById('tabMenu').classList.toggle('active', tab === 'menu');
  
  if (tab === 'menu') {
    document.getElementById('filterBox').style.display = 'none';
    document.getElementById('tableOrders').style.display = 'none';
    document.getElementById('tableMenu').style.display = 'block';
    fetchMenuData();
  } else {
    document.getElementById('filterBox').style.display = 'flex';
    document.getElementById('tableOrders').style.display = 'block';
    document.getElementById('tableMenu').style.display = 'none';
    fetchData();
  }
}

// ==========================================
// LOGIKA KELOLA MENU
// ==========================================
async function fetchMenuData() {
  const tbody = document.getElementById('menuTableBody');
  tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; padding:30px;">Memuat menu...</td></tr>';

  const { data, error } = await sb.from('menu').select('*').eq('kantin_id', KANTIN_ID).order('name', { ascending: true });
  
  if (error) { showToast('Gagal memuat menu'); return; }
  allMenus = data || [];

  if (allMenus.length === 0) {
    tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; padding:30px;">Belum ada menu di warung ini.</td></tr>';
    return;
  }

  tbody.innerHTML = allMenus.map(m => {
    const imgUrl = getImageUrl(m.name);
    const isAvailable = m.is_available !== false; 
    
    return `
      <tr>
        <td><img src="${imgUrl}" style="width: 50px; height: 50px; object-fit: cover; border-radius: 6px;" onerror="this.src='https://images.unsplash.com/photo-1546069901-ba9599a7e63c?q=80&w=400&auto=format&fit=crop'"></td>
        <td><b>${m.name}</b></td>
        <td>Rp ${m.price.toLocaleString('id-ID')}</td>
        <td style="text-transform: capitalize;">${m.category}</td>
        <td>
          <label class="switch">
            <input type="checkbox" ${isAvailable ? 'checked' : ''} onchange="toggleMenuStatus(${m.id}, ${isAvailable})">
            <span class="slider"></span>
          </label>
          <span class="status-label" style="color: ${isAvailable ? '#1a6b4a' : '#dc4a3d'};">
            ${isAvailable ? 'Tersedia' : 'Habis'}
          </span>
        </td>
      </tr>
    `;
  }).join('');
}

async function toggleMenuStatus(id, currentStatus) {
  const newStatus = !currentStatus;
  const { error } = await sb.from('menu').update({ is_available: newStatus }).eq('id', id);
  
  if (error) {
    showToast('Gagal mengubah status menu');
  } else {
    showToast(newStatus ? 'Menu Tersedia' : 'Menu ditandai Habis');
    fetchMenuData(); 
  }
}
// ==========================================

function changeFilterType() {
  const type = document.getElementById('filterType').value;
  const inputTanggal = document.getElementById('filterTanggal');
  const inputBulan = document.getElementById('filterBulan');

  if (type === 'daily') {
    inputTanggal.style.display = 'inline-block';
    inputBulan.style.display = 'none';
    if(!inputTanggal.value) {
      const today = new Date();
      inputTanggal.value = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;
    }
  } else if (type === 'monthly') {
    inputTanggal.style.display = 'none';
    inputBulan.style.display = 'inline-block';
    if(!inputBulan.value) {
      const today = new Date();
      inputBulan.value = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}`;
    }
  } else {
    inputTanggal.style.display = 'none';
    inputBulan.style.display = 'none';
  }
  
  fetchData();
}

function resetFilter() {
  document.getElementById('filterType').value = 'daily';
  const today = new Date();
  document.getElementById('filterTanggal').value = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;
  document.getElementById('filterBulan').value = '';
  changeFilterType();
}

async function fetchData() {
  const { data } = await sb.from('orders').select('*').eq('kantin_id', KANTIN_ID).order('created_at', { ascending: false });
  allOrders = data || [];

  const type = document.getElementById('filterType').value;
  const dateVal = document.getElementById('filterTanggal').value;
  const monthVal = document.getElementById('filterBulan').value;
  const revenueTitle = document.getElementById('revenueTitle');
  
  let rev = 0;
  let activeCount = 0;

  if (type === 'daily' && dateVal) {
    const dateObj = new Date(dateVal);
    revenueTitle.textContent = `Pendapatan (${dateObj.toLocaleDateString('id-ID', { day:'numeric', month:'short', year:'numeric' })})`;
  } else if (type === 'monthly' && monthVal) {
    const monthObj = new Date(monthVal + '-01');
    revenueTitle.textContent = `Pendapatan (${monthObj.toLocaleDateString('id-ID', { month:'long', year:'numeric' })})`;
  } else {
    revenueTitle.textContent = `Pendapatan (Semua Waktu)`;
  }

  allOrders.forEach(o => {
    const orderDate = new Date(o.created_at);
    const oYear = orderDate.getFullYear();
    const oMonth = String(orderDate.getMonth() + 1).padStart(2, '0');
    const oDay = String(orderDate.getDate()).padStart(2, '0');
    
    const orderDateStr = `${oYear}-${oMonth}-${oDay}`;
    const orderMonthStr = `${oYear}-${oMonth}`;

    let isMatch = false;
    if (type === 'all') {
      isMatch = true;
    } else if (type === 'daily' && dateVal && orderDateStr === dateVal) {
      isMatch = true;
    } else if (type === 'monthly' && monthVal && orderMonthStr === monthVal) {
      isMatch = true;
    }

    if (isMatch) {
      if (o.status === 'Selesai') {
        rev += o.total_amount;
      } else {
        activeCount++;
      }
    }
  });
  
  document.getElementById('revenueTotal').textContent = 'Rp ' + rev.toLocaleString();
  document.getElementById('orderCount').textContent = activeCount;

  renderTable();
}

function renderTable() {
  const tbody = document.getElementById('tableBody');
  const type = document.getElementById('filterType').value;
  const dateVal = document.getElementById('filterTanggal').value;
  const monthVal = document.getElementById('filterBulan').value;
  
  let filteredOrders = currentTab === 'active' 
    ? allOrders.filter(o => o.status !== 'Selesai') 
    : allOrders.filter(o => o.status === 'Selesai');

  if (type === 'daily' && dateVal) {
    filteredOrders = filteredOrders.filter(o => {
      const d = new Date(o.created_at);
      const oDateStr = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
      return oDateStr === dateVal;
    });
  } else if (type === 'monthly' && monthVal) {
    filteredOrders = filteredOrders.filter(o => {
      const d = new Date(o.created_at);
      const oMonthStr = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
      return oMonthStr === monthVal;
    });
  }

  if (filteredOrders.length === 0) { 
    let emptyMsg = '';
    if (currentTab === 'active') {
      emptyMsg = 'Tidak ada antrean aktif pada filter ini.';
    } else {
      emptyMsg = 'Tidak ada riwayat selesai pada filter ini.';
    }
    tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; padding:30px;">${emptyMsg}</td></tr>`; 
    return; 
  }

  tbody.innerHTML = filteredOrders.map(o => {
    const d = new Date(o.created_at);
    const waktu = d.toLocaleDateString('id-ID', { day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' });
    
    let txt = '-';
    if (o.items) {
      txt = o.items.split(';').map(x => {
        const p = x.split('|');
        const spicyText = p[4] ? ` <span style="color:#dc4a3d; font-size:11px; font-weight:bold;">(${p[4]})</span>` : '';
        const noteText = p[5] ? `<br><span style="color:#64748b; font-size:11px; font-style:italic;">📝 ${p[5]}</span>` : '';
        return `<div style="margin-bottom: 8px;">${p[0]}${spicyText} <span style="color:#64748b; font-size:12px;">(x${p[2]})</span>${noteText}</div>`;
      }).join('');
    }

    let tipeBadge = '';
    if (o.tipe_user === 'mahasiswa') {
      tipeBadge = '<span class="badge-tipe" style="background:#dbeafe;color:#1e40af">Mahasiswa/i</span>';
    } else if (o.tipe_user === 'pelanggan') {
      tipeBadge = '<span class="badge-tipe" style="background:#e0e7ff;color:#4338ca">Pelanggan</span>';
    } else {
      tipeBadge = '<span class="badge-tipe" style="background:#fef3c7;color:#92400e">Guest</span>';
    }

    const statusBadge = o.status === 'Selesai' ? '<span class="badge-status">Selesai</span>' : '';
    let orderTypeBadge = '';
    if (o.catatan && o.catatan.includes('Take Away')) {
      orderTypeBadge = '<span class="badge-tipe" style="background:#fee2e2; color:#dc4a3d;"><i class="fas fa-shopping-bag"></i> Take Away</span>';
    } else {
      orderTypeBadge = '<span class="badge-tipe" style="background:#e8f5ee; color:#1a6b4a;"><i class="fas fa-utensils"></i> Dine In</span>';
    }

    let actionButtons = `<button class="btn-action btn-print" onclick="printStruk(${o.id})">Print</button>`;
    if (currentTab === 'active') {
      actionButtons += `
        <button class="btn-action btn-done" onclick="askMarkDone(${o.id})">Selesai</button>
        <button class="btn-action btn-del" onclick="askDelete(${o.id})">Hapus</button>
      `;
    } else {
      actionButtons += `<button class="btn-action btn-del" onclick="askDelete(${o.id})">Hapus</button>`;
    }

    let mejaNamaHtml = `
      <div style="font-weight: 700; font-size: 14px; color: #1e293b; margin-bottom: 2px; white-space: nowrap;">Meja ${o.no_meja}</div>
      <div style="font-size: 13px; color: #475569; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 150px;" title="${o.nama_pemesan}">${o.nama_pemesan}</div>
      <div style="display: flex; gap: 5px; align-items: center; flex-wrap: wrap;">
        ${tipeBadge}
        ${statusBadge}
        ${orderTypeBadge}
      </div>
    `;

    return `<tr>
      <td style="color:#64748b; font-size:12px;">${waktu}</td>
      <td>${mejaNamaHtml}</td>
      <td style="font-size:13px;">${txt}</td>
      <td style="white-space: nowrap;"><b>Rp ${o.total_amount.toLocaleString()}</b></td>
      <td style="white-space: nowrap;">
        <div style="display: flex; gap: 5px; flex-wrap: nowrap;">
          ${actionButtons}
        </div>
      </td>
    </tr>`;
  }).join('');
}

function printStruk(id) {
  const o = allOrders.find(x => x.id === id);
  if(!o) return;
  const d = new Date(o.created_at);
  const waktu = d.toLocaleDateString('id-ID', { day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit' });
  
  const items = o.items.split(';').map(row => {
    const p = row.split('|');
    const spicyText = p[4] ? `<br><small style="color:#000; font-weight:bold;">(${p[4]})</small>` : '';
    const noteText = p[5] ? `<br><small style="color:#000;">*${p[5]}</small>` : '';
    return `<tr><td>${p[0]}${spicyText}${noteText}</td><td align="center">${p[2]}</td><td align="right">Rp ${parseInt(p[3]).toLocaleString()}</td></tr>`;
  }).join('');

  const printArea = document.getElementById('printArea');
  printArea.innerHTML = `
    <div style="font-family:monospace; width:80mm; padding:5mm; color:#000;">
      <center><h2>${KANTIN_NAMES[KANTIN_ID].toUpperCase()}</h2><p>Struk Pesanan</p></center>
      <hr style="border-top:1px dashed #000;">
      <p>Waktu: ${waktu}</p>
      <p>Nama: ${o.nama_pemesan} (${o.tipe_user})</p>
      <p>Meja: ${o.no_meja} | Tipe: ${o.catatan}</p>
      <hr style="border-top:1px dashed #000;">
      <table width="100%"><tr><th align="left">Item</th><th>Qty</th><th align="right">Total</th></tr>${items}</table>
      <hr style="border-top:1px dashed #000;">
      <h3 align="right">Total: Rp ${o.total_amount.toLocaleString()}</h3>
      <center><p style="margin-top:20px;">Status: ${o.status}</p></center>
    </div>
  `;
  printArea.style.display = 'block';
  window.print();
  printArea.style.display = 'none';
}

function askMarkDone(id) {
  pendingActionId = id;
  currentActionType = 'selesai';
  
  document.getElementById('modalIcon').innerHTML = '<i class="fas fa-check-circle" style="color: #1a6b4a;"></i>';
  document.getElementById('modalTitle').textContent = 'Selesaikan Pesanan?';
  document.getElementById('modalDesc').textContent = 'Pesanan ini akan dipindahkan ke tab Riwayat Selesai.';
  
  const btn = document.getElementById('modalConfirmBtn');
  btn.style.background = '#1a6b4a';
  btn.textContent = 'Selesai';
  
  document.getElementById('actionModal').classList.add('active');
}

function askDelete(id) {
  pendingActionId = id;
  currentActionType = 'hapus';

  document.getElementById('modalIcon').innerHTML = '<i class="fas fa-trash-alt" style="color: #dc4a3d;"></i>';
  document.getElementById('modalTitle').textContent = 'Hapus Pesanan?';
  document.getElementById('modalDesc').textContent = 'Tindakan ini permanen dan tidak dapat dibatalkan.';
  
  const btn = document.getElementById('modalConfirmBtn');
  btn.style.background = '#dc4a3d';
  btn.textContent = 'Hapus';

  document.getElementById('actionModal').classList.add('active');
}

function closeActionModal() {
  document.getElementById('actionModal').classList.remove('active');
  pendingActionId = null;
  currentActionType = null;
}

async function executeAction() {
  if (!pendingActionId || !currentActionType) return;
  
  const btn = document.getElementById('modalConfirmBtn');
  btn.disabled = true;
  btn.textContent = 'Memproses...';

  if (currentActionType === 'selesai') {
    await sb.from('orders').update({ status: 'Selesai' }).eq('id', pendingActionId);
    showToast('Pesanan Selesai!');
  } else {
    await sb.from('orders').delete().eq('id', pendingActionId);
    showToast('Pesanan dihapus');
  }
  
  closeActionModal();
  btn.disabled = false;
  fetchData();
}

function openLogoutModal() {
  document.getElementById('logoutModal').classList.add('active');
}

function closeLogoutModal() {
  document.getElementById('logoutModal').classList.remove('active');
}

function executeLogout() {
  sessionStorage.clear(); 
  window.location.href = '/'; 
}

checkAuth();
if (KANTIN_ID) {
  fetchData();
  // LOGIKA NOTIFIKASI SUARA SAAT ADA PESANAN BARU
  sb.channel('realtime-kasir').on('postgres_changes', { event: '*', schema: 'public', table: 'orders', filter: `kantin_id=eq.${KANTIN_ID}` }, (payload) => {
    // Jika tipe event-nya adalah INSERT (Pesanan Baru Masuk)
    if (payload.eventType === 'INSERT') {
      playNotif();
    }
    fetchData(); // Refresh tabel
  }).subscribe();
}
</script>
